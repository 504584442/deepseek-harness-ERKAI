<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="天幕 TM Agent">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b16"/>
      <stop offset="0.55" stop-color="#0b1e39"/>
      <stop offset="1" stop-color="#102a4c"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0.06" y1="1" x2="0.94" y2="0.1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b93fb"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f7ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c7ecfd"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8b93fb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#tile)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="218" ry="218" fill="none" stroke="#7dd3fc" stroke-opacity="0.16" stroke-width="6"/>

  <!-- Star field -->
  <g fill="#e0f2fe">
    <circle cx="228" cy="268" r="10" fill-opacity="0.9"/>
    <circle cx="348" cy="182" r="5" fill-opacity="0.5"/>
    <circle cx="512" cy="236" r="7" fill-opacity="0.75"/>
    <circle cx="676" cy="170" r="5" fill-opacity="0.45"/>
    <circle cx="800" cy="272" r="10" fill-opacity="0.85"/>
    <circle cx="168" cy="404" r="5" fill-opacity="0.38"/>
    <circle cx="862" cy="408" r="5" fill-opacity="0.38"/>
    <circle cx="512" cy="330" r="4" fill-opacity="0.35"/>
  </g>

  <!-- Canopy bloom (soft halo behind the arc) -->
  <path d="M 168 668 Q 512 132 856 668" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="132" stroke-linecap="round"/>
  <!-- Canopy arc -->
  <path d="M 176 664 Q 512 150 848 664" fill="none" stroke="url(#canopy)" stroke-width="56" stroke-linecap="round"/>
  <!-- Canopy posts: the two anchors holding the 幕 -->
  <circle cx="176" cy="664" r="26" fill="#22d3ee"/>
  <circle cx="848" cy="664" r="26" fill="#8b93fb"/>

  <!-- Agent core, seated inside the canopy -->
  <circle cx="512" cy="742" r="138" fill="url(#coreGlow)"/>
  <circle cx="512" cy="742" r="58" fill="url(#orb)"/>
  <circle cx="512" cy="742" r="58" fill="none" stroke="#e0f7ff" stroke-opacity="0.9" stroke-width="6"/>

  <!-- Horizon light -->
  <path d="M 244 846 L 780 846" stroke="url(#horizon)" stroke-width="16" stroke-linecap="round"/>
</svg>
